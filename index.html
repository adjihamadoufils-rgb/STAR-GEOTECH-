<style>
:root{--p:#0b2a55;--s:#4aa3df;--bg:#fff;--w:#eef2f6;--t:#14202e;--ok:#1b8a3e;--wa:#c26a00;--er:#c62828;--b:#cfd8e3;--a:#0b2a55}
:root[data-t=d]{--bg:#0f1722;--w:#18222f;--t:#e6edf5;--b:#2a3646;--a:#4aa3df;--ok:#4cc26e;--wa:#f0a030;--er:#ff7070}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,Roboto,sans-serif;background:var(--bg);color:var(--t);padding-bottom:70px}
header{background:#0b2a55;color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:5}
header b{flex:1;font-size:18px}header small{display:block;font-weight:400;font-size:11px;opacity:.8}
select,input,textarea,button{font:inherit;color:var(--t)}
select,input,textarea{width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;background:var(--bg)}
header select{width:auto;max-width:42%;background:#fff;color:#000}
main{padding:12px;max-width:760px;margin:auto}
button{min-height:46px;padding:0 16px;border:0;border-radius:10px;background:var(--p);color:#fff;font-weight:600}
[data-t=d] button{background:#1f6fb2}button.s{background:var(--w);color:var(--t);border:1px solid var(--b)}button.d{background:var(--er);color:#fff}
header button{min-height:38px;background:#1f5ea8;padding:0 10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:1px solid var(--b);z-index:5}
nav button{flex:1;background:none;color:var(--t);border-radius:0;min-height:58px;font-size:12px;padding:0}nav button.on{color:var(--a);border-top:3px solid var(--a)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.c{background:var(--w);border-radius:12px;padding:14px;margin:10px 0}
.card{background:var(--w);border:1px solid var(--b);border-radius:12px;padding:14px;text-align:left;min-height:96px;color:var(--t);display:block;width:100%}
.card b{color:var(--a);display:block;font-size:17px}.card span{font-size:13px;opacity:.85;font-weight:400}
label{display:block;font-size:13px;margin:8px 0 3px;opacity:.9}h2{margin:6px 0;color:var(--a);font-size:21px}h3{margin:10px 0 4px;font-size:16px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--b);padding:5px;text-align:right}th{background:var(--w)}td input{padding:6px;min-width:52px}
.sc{overflow-x:auto}.ok{color:var(--ok)}.wa{color:var(--wa)}.er{color:var(--er)}.m{padding:8px 10px;border-radius:8px;margin:6px 0;border-left:4px solid}
.m.ok{background:#1b8a3e1a;border-color:var(--ok)}.m.wa{background:#c26a001a;border-color:var(--wa)}.m.er{background:#c628281a;border-color:var(--er)}
.tabs{display:flex;gap:6px;overflow-x:auto}.tabs button{flex:none;min-height:40px}canvas{width:100%;background:#fff;border:1px solid var(--b);border-radius:8px}
.r{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.r>*{flex:1}
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;z-index:9;display:none}
#rep{display:none;background:#fff;color:#000;padding:14px}#rep table th{background:#e8eef5}#rep th,#rep td{border-color:#999}
@media print{body{padding:0;background:#fff}header,nav,#app,.np{display:none!important}#rep{display:block!important}}
</style></head><body>

function interp(r,p){for(let i=0;i<r.length-1;i++){const a=r[i],b=r[i+1];if(a.p>=p&&b.p<=p){if(a.p==b.p)return b.d;return Math.pow(10,Math.log10(a.d)+(p-a.p)/(b.p-a.p)*(Math.log10(b.d)-Math.log10(a.d)))}}return NaN}
function grCalc(){grRead();const m0=n($('#g0').value),fond=n($('#gf').value)||0;
let r=GR.map(x=>({d:n(x.d),m:n(x.m)||0})).filter(x=>x.d>0);
if(!(m0>0))return show({err:'La masse initiale M0 doit être supérieure à 0.'});
if(r.length<3)return show({err:'Saisissez au moins 3 tamis.'});
if(r.some(x=>x.m<0)||fond<0)return show({err:'Les masses ne peuvent pas être négatives.'});
r.sort((a,b)=>b.d-a.d);if(r.some((x,i)=>i&&x.d==r[i-1].d))return show({err:'Deux tamis ont la même ouverture.'});
let c=0;r.forEach(x=>{c+=x.m;x.rc=c;x.rp=x.m/m0*100;x.rcp=c/m0*100;x.p=100-x.rcp});
const tot=c+fond,ec=(tot-m0)/m0*100;let w='';
if(Math.abs(ec)>1)w+=msg('wa',`Bilan massique : écart de ${f(ec)} % entre Σ masses (${f(tot)} g) et M0. Une tolérance de 1 % est ici utilisée comme alerte indicative (à confronter à votre norme).`);else w+=msg('ok',`Bilan massique : écart ${f(ec)} %.`);
if(r.some(x=>x.p<-1e-9))w+=msg('er','Passant négatif : les masses retenues dépassent M0. Vérifiez la saisie.');
const D10=interp(r,10),D30=interp(r,30),D60=interp(r,60),Cu=D60/D10,Cc=D30*D30/(D10*D60);
const ok=isFinite(Cu)&&isFinite(Cc);if(!ok)w+=msg('wa','D10, D30 ou D60 non déterminable : la courbe ne couvre pas ces passants (tamis plus fins nécessaires). Cu et Cc non calculés.');
let it=S.ref=='none'?'Interprétation normative non disponible : aucun référentiel sélectionné.':'Classification granulométrique '+S.ref+' non codée dans cette version : interprétation non disponible.';
if(S.ref=='ASTM'&&ok){const g=$('#gt').value=='G',cm=g?4:6,bien=Cu>=cm&&Cc>=1&&Cc<=3;it=`Critères USCS (ASTM D2487) pour ${g?'graviers (Cu ≥ 4':'sables (Cu ≥ 6'} et 1 ≤ Cc ≤ 3) : matériau ${bien?'bien gradué':'mal gradué'}. La classification complète exige aussi le % de fines et les limites d'Atterberg.`}
else if(S.ref=='ASTM')it='Critères USCS non évaluables sans D10, D30 et D60.';
const res=`<h3>Résultats</h3>`+T(['Tamis (mm)','Retenu (g)','Refus partiel %','Refus cumulé (g)','Refus cumulé %','Passant %'],r.map(x=>[f(x.d,3),f(x.m,1),f(x.rp),f(x.rc,1),f(x.rcp),f(x.p)]))+
`<p>Fond : ${f(fond,1)} g · Σ = ${f(tot,1)} g</p>`+T(['D10 (mm)','D30 (mm)','D60 (mm)','Cu','Cc'],[[f(D10,3),f(D30,3),f(D60,3),f(Cu),f(Cc)]])+msg('ok',esc(it));
const draw=cv=>{const x=cv.getContext('2d'),W=cv.width,H=cv.height,l=48,b=34,t=14,rr=14,mn=Math.pow(10,Math.floor(Math.log10(r[r.length-1].d))),mx=Math.pow(10,Math.ceil(Math.log10(r[0].d)));
const X=d=>l+(Math.log10(mx)-Math.log10(d))/(Math.log10(mx)-Math.log10(mn))*(W-l-rr),Y=p=>t+(100-p)/100*(H-t-b);
x.fillStyle='#fff';x.fillRect(0,0,W,H);x.font='12px sans-serif';x.fillStyle='#000';x.strokeStyle='#ccc';
for(let p=0;p<=100;p+=10){x.beginPath();x.moveTo(l,Y(p));x.lineTo(W-rr,Y(p));x.stroke();x.fillText(p,l-26,Y(p)+4)}
for(let e=Math.log10(mn);e<=Math.log10(mx)+.01;e++)for(let k=1;k<10;k++){const d=k*Math.pow(10,e);if(d<mn||d>mx)continue;x.strokeStyle=k==1?'#999':'#e4e4e4';x.beginPath();x.moveTo(X(d),t);x.lineTo(X(d),H-b);x.stroke();if(k==1)x.fillText(+d.toPrecision(3),X(d)-8,H-b+16)}
x.fillText('Diamètre (mm, échelle log)',W/2-60,H-4);x.save();x.translate(12,H/2+30);x.rotate(-Math.PI/2);x.fillText('Passant (%)',0,0);x.restore();
x.strokeStyle='#0b2a55';x.fillStyle='#0b2a55';x.lineWidth=2.5;x.beginPath();r.forEach((a,i)=>{i?x.lineTo(X(a.d),Y(a.p)):x.moveTo(X(a.d),Y(a.p))});x.stroke();r.forEach(a=>{x.beginPath();x.arc(X(a.d),Y(a.p),3.5,0,7);x.fill()});
x.setLineDash([5,4]);x.lineWidth=1.2;x.strokeStyle='#c26a00';x.fillStyle='#c26a00';[[D10,10,'D10'],[D30,30,'D30'],[D60,60,'D60']].forEach(([d,p,nm])=>{if(!isFinite(d))return;x.beginPath();x.moveTo(l,Y(p));x.lineTo(X(d),Y(p));x.lineTo(X(d),H-b);x.stroke();x.fillText(nm,X(d)+3,Y(p)-4)})};

${I('he','QM lu sur l\'abaque p.43 (si couches liées ≥ 0,20 m)')}${I('hi','IA lu sur l\'abaque p.44 (°C·jour)')}
<div class="r"><button onclick="ggKeep();HL.push({m:'',e:''});go('lab','gg')">+ Couche</button><button class="s" onclick="GGX={hz:'2',hs:'StG',hm:'12',hc:'40',hq:'90',he:'0.71',hi:'96'};HL=[{m:'BBSG',e:'6'},{m:'GC',e:'27'}];go('lab','gg')">Exemple</button><button onclick="ggC()">Calculer</button></div></div>`}
function ggC(){ggKeep();const o=GGX,A=+o.hm,h=n(o.hc)/100,Epf=n(o.hq),IR=o.hz=='1'?60:90;
if(o.hs=='SnG')return show({err:'Support non gélif : la vérification au gel n\'est pas à effectuer (Qg = ∞).'});
if(isNaN(h)||!(h>=0)||!(Epf>0))return show({err:'Renseignez l\'épaisseur de couche de forme (≥ 0) et Epf > 0.'});
const L=HL.filter(x=>x.m||x.e!=='');if(!L.length||L.some(x=>!(x.m in EM)&&x.m!='GNT'||!(n(x.e)>0)))return show({err:'Couches : matériau parmi BBSG, EME2, GB3, GC, GNT et épaisseur > 0.'});
const liees=L.filter(x=>x.m in EM),Hl=liees.reduce((a,x)=>a+n(x.e),0)/100,Hc=L.reduce((a,x)=>a+n(x.e),0)/100,Eeq=liees.length?eeqF(liees.map(x=>[EM[x.m],n(x.e)])):NaN,qng=h>0?qngF(A,h):0,qg=o.hs=='SpG'?2.5:0;let w='',qm=0;
if(Hl>=.2){qm=n(o.he);if(isNaN(qm)){w+=msg('wa','Couches liées ≥ 0,20 m : lisez QM sur l\'abaque p.43 (Hliés = '+f(Hl,2)+' m, Eeq/Epf = '+f(Eeq/Epf,0)+') et saisissez-le.')}}
w+=msg('wa','Le guide indique QM = 0 pour Hliés ≤ 0,20 m, mais son exemple donne QM = 0,52 pour 0,20 m : ici QM = 0 si Hliés < 0,20 m.');
const qpf=qng+qg+(isNaN(qm)?0:qm),ia=n(o.hi);let it;
if(isNaN(qm))it='QM manquant : Qpf non définitif.';else if(isNaN(ia))it=`Qpf = ${f(qpf)} ; Hchaussée = ${f(Hc,2)} m : lisez IA sur l'abaque p.44 puis comparez à IR = ${IR} °C·jour.`;else{const ok=ia>=IR;it=`IA = ${f(ia,0)} ${ok?'≥':'<'} IR = ${IR} °C·jour : structure ${ok?'convenable':'ne convient pas'} au gel selon le guide.`;w+=msg(ok?'ok':'er',esc(it))}
show({type:'Vérification au gel (Grand Lyon)',ref:'Guide Grand Lyon (mars 2017) §6, document fourni par l\'utilisateur',inp:`<p>Zone ${o.hz} (IR = ${IR}) ; support ${o.hs} ; Epf = ${f(Epf,0)} MPa ; couche de forme ${f(h*100,0)} cm (Ang ${A}) ; ${L.map(x=>esc(x.m)+' '+f(n(x.e),1)+' cm').join(', ')}</p>`,
steps:'Qng = Ang·h²/(h+0,1) ; Qg = 0 (StG) ou 2,5 (SpG) ; Eeq = Σ(E·h)/Σh des couches liées (BBSG 7000, EME2 14000, GB3 9000, GC 23000 MPa) ; Qpf = Qng + Qg + QM ; IA lu sur abaque ; conforme si IA ≥ IR.',
res:'<h3>Résultats</h3>'+T(['Qng','Qg','Hliés (m)','Eeq (MPa)','Eeq/Epf','QM','Qpf','Hchaussée (m)','IA','IR'],[[f(qng),f(qg),f(Hl,2),f(Eeq,0),f(Eeq/Epf,0),isNaN(qm)?'—':f(qm),isNaN(qm)?'—':f(qpf),f(Hc,2),isNaN(ia)?'—':f(ia,0),IR]]),warn:w,interp:it,csv:[['Qng','Qg','Hlies','Eeq','Eeq/Epf','QM','Qpf','Hchaussee','IA','IR'],[qng,qg,Hl,Eeq,Eeq/Epf,qm,qpf,Hc,ia,IR]]})}
/* ---- Guide d'utilisation ---- */
function help(){const D=(t,b,o)=>`<details class="c" ${o?'open':''}><summary><b>${t}</b></summary>${b}</details>`;
return `<h2>Guide d'utilisation</h2>`+
D('Démarrage',`<p>STAR GEOTECH est une aide au calcul et à la rédaction de rapports géotechniques. Il fonctionne hors connexion, sans compte ni abonnement, et les calculs sont faits sur votre appareil.</p><ol><li>Créez ou choisissez un projet (liste en haut, Réglages pour le nom, le client, le chantier et le laboratoire).</li><li>Choisissez le <b>référentiel</b> (NF/EN, ASTM, AASHTO ou aucun) en haut de l'onglet Essais, <b>avant</b> de saisir.</li><li>Ouvrez un essai, saisissez les données, appuyez sur <b>Calculer</b>.</li><li>Ajoutez observations et conclusion, puis <b>Enregistrer dans le projet</b>.</li></ol><p>Chaque module a un bouton <b>Exemple</b> qui remplit des données de démonstration.</p>`,1)+
D('Les modules',`<p><b>Essais (onglet Essais)</b></p><ul><li><b>Granulo</b> : M0, masses par tamis, fond. Refus, passants, bilan massique, courbe en échelle logarithmique, D10/D30/D60, Cu, Cc.</li><li><b>Eau</b> : tare, humide, sec. Masse d'eau, sol sec, w.</li><li><b>Atterberg</b> : points de liquidité (Casagrande ou cône), limite de plasticité. WL, WP, IP, indice de consistance.</li><li><b>Bleu</b> : volume de bleu, masse de la prise. VBS (sols) ou MB (granulats).</li><li><b>LA / MDE</b> : masses avant et après. Coefficient et comparaison au seuil que vous saisissez.</li><li><b>Proctor</b> : volume du moule, points (w, masse). ρh, ρd, courbe, wopt, γd max. Comparaison normal / modifié de deux essais enregistrés.</li><li><b>CBR</b> : pénétrations et charges. Contraintes, CBR à 2,5 et 5 mm, courbe.</li><li><b>Marshall</b> : masses, stabilité, fluage. Densité, vides, VMA, VFA si Gmm, liant et Gsb sont fournis.</li><li><b>Liant</b> : extraction. Teneur en liant en % du mélange et des granulats.</li></ul><p><b>In situ</b> : <b>Sable</b>, <b>Nucléaire</b> (densité, degré de compactage), <b>Benkelman</b> (déflexions), <b>Temp. enrobés</b>, <b>Atelier</b> (productivité du compactage).</p><p><b>Routes</b> : onglet Routes (trafic vers NEE) ; onglets <b>Dimension.</b> (document « Projet routier »), <b>Grand Lyon</b> et <b>Gel</b> (guide Grand Lyon, mars 2017).</p>`)+
D('Référentiels et seuils',`<p>L'appli affiche les références (NF, ASTM, AASHTO) de chaque essai dans les rapports. Elle ne contient <b>aucun seuil réglementaire</b> : pour juger la conformité, saisissez le seuil de votre norme ou de votre marché. Sans seuil, elle ne conclut pas.</p><p>Exceptions : critères de gradation USCS (ASTM D2487) en granulométrie, règle de la valeur CBR retenue (ASTM/AASHTO), et les tableaux des documents fournis pour le dimensionnement.</p>`)+
D('Rapports et exports',`<p>Onglet <b>Historique</b> : <b>Rapport</b> (logo, laboratoire, projet, client, chantier, données, formules, résultats, graphique, interprétation, observations, conclusion), <b>CSV</b> (données), <b>Suppr.</b>.</p><p>Pour un PDF : ouvrez le rapport, appuyez sur <b>Imprimer / PDF</b>, puis choisissez « Enregistrer au format PDF » (selon le navigateur, via le menu Partager ou Imprimer).</p>`)+
D('Sauvegarde et hors connexion',`<p>Les données sont stockées dans le navigateur de l'appareil. Elles peuvent disparaître si vous effacez les données du navigateur ou changez de navigateur.</p><ul><li>Réglages → <b>Exporter</b> : fichier JSON de sauvegarde à conserver (à faire régulièrement).</li><li>Réglages → <b>Importer</b> : restaure une sauvegarde (remplace les données actuelles).</li></ul><p>Sur Android : enregistrez le fichier HTML, ouvrez-le avec Chrome depuis le gestionnaire de fichiers. Ouvrez-le toujours de la même façon pour retrouver vos données ; le comportement du stockage peut varier selon le navigateur.</p>`)+
D('Limites et précautions',`<ul><li>Résultats = aide technique, à valider par un ingénieur responsable. Le dimensionnement est indicatif.</li><li>Les épaisseurs des catalogues de structures de chaussée ne sont pas codées : on les lit dans le document et on saisit la structure.</li><li>Non disponibles pour l'instant : correction de l'origine du CBR, correction des éléments grossiers du Proctor, facteur de correction d'épaisseur Marshall (à saisir).</li><li>L'assistant est local et à règles (mots-clés) : il ne comprend pas toutes les formulations et ne répond que sur les sujets de sa base.</li><li>Les valeurs lues sur abaques (QM, IA) se saisissent à la main.</li><li>Fonctions testées par calcul sur des exemples ; non encore validées sur un parc d'appareils Android.</li></ul><p><button class="s" onclick="go('tests')">Liste de contrôle des tests</button></p>`);}
/* ---- Assistant géotechnique (local, à règles) ---- */
const nrm=x=>String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const KB=[
{t:'Analyse granulométrique',k:['granulo','bilan','massique','tamis','tamisage','courbe','d10','d30','d60','cu','cc','uniformite','courbure','passant','refus'],o:'Déterminer la répartition en taille des grains d\'un sol ou d\'un granulat par tamisage.',d:'Masse initiale sèche M0, masse retenue sur chaque tamis, masse du fond.',f:'Refus partiel % = m/M0×100 ; refus cumulé % = somme des refus partiels ; passant % = 100 − refus cumulé % ; Cu = D60/D10 ; Cc = D30²/(D10×D60). Les D sont lus par interpolation linéaire en log(D).',p:'Sécher et peser M0 ; laver si la norme l\'exige ; tamiser sur la colonne de tamis ; peser le refus de chaque tamis et le fond ; contrôler que la somme des masses retrouve M0.',a:'Bilan massique hors tolérance : pertes de fines (poussières, lavage), tamis colmatés, échantillon non sec, erreur de pesée. Passant négatif : masses retenues supérieures à M0. D10 non déterminable : la courbe ne descend pas assez bas, il manque des tamis fins.',l:'La classification dépend du référentiel choisi ; sans référentiel, l\'appli n\'interprète pas.'},
{t:'Limites d\'Atterberg',k:['atterberg','liquidite','plasticite','casagrande','coupelle','wl','wp','indice de plasticite','consistance'],o:'Caractériser la plasticité d\'un sol fin : teneurs en eau aux limites de liquidité (WL) et de plasticité (WP).',d:'Points de liquidité (coups ou pénétration, masses tare / humide / sec), déterminations de WP, passant à 80 µm pour le classement NF.',f:'w = (humide − sec)/(sec − tare)×100 ; droite w en fonction de log10(N) (Casagrande) ou de la pénétration (cône) ; WL = w à 25 coups ou à la pénétration prescrite ; WP = moyenne des déterminations ; IP = WL − WP ; Ic = (WL − w)/IP ; IL = (w − WP)/IP.',p:'Préparer le sol (fraction fine selon la norme) ; faire 3 points ou plus de liquidité à teneurs en eau différentes ; rouler des rouleaux jusqu\'à fissuration pour WP ; mesurer chaque teneur en eau à l\'étuve.',a:'Teneur en eau qui monte avec les coups : points inversés ou mal préparés. WP supérieure à WL : erreur de saisie ou de manipulation. Droite très dispersée : préparation non homogène ou séchage incomplet.',l:'Le classement dépend du référentiel : ligne A (ASTM D2487) ou classes A1 à A4 selon l\'IP (NF P 11-300, sols fins). Les autres classements ne sont pas codés.'},
{t:'Bleu de méthylène',k:['bleu','methylene','vbs','argilosite','tache'],o:'Mesurer l\'activité argileuse d\'un sol (VBS) ou d\'un granulat (MB).',d:'Masse sèche de la prise, volume et concentration de la solution de bleu, proportion 0/5 dans 0/50 pour la VBS.',f:'B (g) = V × c / 1000 ; VBS = B/m × 100 × proportion 0/5 ; MB (g/kg) = V × c / m.',p:'Disperser la prise dans l\'eau ; ajouter le bleu par doses ; après chaque dose, déposer une goutte sur papier filtre ; la tache persistante marque la fin de l\'essai.',a:'Valeur très faible malgré un sol visiblement argileux : arrêt prématuré, test de la tache mal lu. Valeur incohérente avec l\'IP : prise non représentative ou fraction mal déterminée.',l:'Seuils de VBS du tableau GTR cités à titre indicatif ; la classe dépend d\'autres paramètres.'},
{t:'Teneur en eau',k:['teneur en eau','etuve','humidite','eau naturelle'],o:'Mesurer la masse d\'eau contenue dans un sol, rapportée à la masse de sol sec.',d:'Masse du récipient, masse récipient + sol humide, masse récipient + sol sec.',f:'Masse d\'eau = (récipient + humide) − (récipient + sec) ; masse de sol sec = (récipient + sec) − récipient ; w = masse d\'eau / masse de sol sec × 100.',p:'Peser le récipient vide, puis avec le sol humide ; sécher à l\'étuve à la température et pendant la durée prescrites par la norme, jusqu\'à masse constante ; peser à nouveau.',a:'w supérieur à 100 % : sol organique possible ou erreur de saisie. Masse sèche supérieure à la masse humide : valeurs inversées. Séchage incomplet : w sous-estimée.'},
{t:'Essai Proctor',k:['proctor','optimum','wopt','compactage en laboratoire','masse volumique seche','gamma d','densite seche'],o:'Déterminer la teneur en eau optimale wopt et la masse volumique sèche maximale ρd max d\'un sol pour une énergie de compactage normalisée (normal ou modifié).',d:'Volume du moule, au moins 4 points (teneur en eau, masse de sol humide dans le moule).',f:'ρh = m/V ; ρd = ρh/(1 + w/100) ; courbe ρd(w) = a·w² + b·w + c ajustée aux points ; wopt = −b/2a ; ρd max = ρd(wopt).',p:'Préparer plusieurs échantillons à teneurs en eau croissantes ; compacter dans le moule avec l\'énergie du Proctor choisi ; araser, peser ; prélever du sol pour mesurer w.',a:'Pas de maximum : points trop peu nombreux ou mal répartis, ajoutez des points de part et d\'autre de l\'optimum. ρd très élevée : vérifier le volume du moule et les pesées. En général le modifié donne un ρd max plus élevé et un wopt plus faible que le normal.',l:'Pas de correction des éléments grossiers dans cette version.'},
{t:'Essai CBR',k:['cbr','poinconnement','portance','indice portant'],o:'Évaluer la portance d\'un sol compacté par poinçonnement.',d:'Couples pénétration / charge, aire du piston, unité de charge.',f:'Contrainte σ = F/A ; CBR(2,5) = σ/6,9 MPa × 100 ; CBR(5) = σ/10,3 MPa × 100 ; valeurs interpolées si absentes.',p:'Compacter l\'éprouvette dans le moule CBR selon le mode de la norme ; poinçonner à vitesse constante ; relever la charge à chaque pénétration.',a:'CBR à 5 mm supérieur à celui à 2,5 mm : ASTM/AASHTO imposent de refaire l\'essai. Charge qui diminue : mauvais contact du piston ou lectures erronées.',l:'Correction de l\'origine de la courbe non codée ; la valeur retenue dépend du référentiel.'},
{t:'Essai Los Angeles',k:['los angeles','fragmentation','coefficient la'],o:'Mesurer la résistance des granulats à la fragmentation.',d:'Masse initiale M et masse m retenue sur le tamis prescrit après l\'essai.',f:'LA = (M − m)/M × 100. Tamis : 1,6 mm (NF EN) ou 1,70 mm (ASTM/AASHTO).',a:'m supérieure à M : erreur. Valeur anormalement faible : perte de matière non pesée ou mauvais tamis.',l:'L\'appli compare au seuil que vous saisissez ; elle n\'en connaît pas.'},
{t:'Essai Micro-Deval',k:['micro','deval','mde','attrition','usure'],o:'Mesurer la résistance des granulats à l\'usure en présence d\'eau.',d:'Masse initiale M, masse m retenue au tamis après lavage et séchage.',f:'MDE = (M − m)/M × 100.',a:'Séchage incomplet : m surestimée, donc coefficient sous-estimé.'},
{t:'Essai Marshall',k:['marshall','stabilite','fluage','vides','vma','vfa','eprouvette'],o:'Caractériser un enrobé bitumineux : stabilité, fluage et paramètres volumétriques.',d:'Masses dans l\'air, dans l\'eau et saturée surface sèche, stabilité, fluage ; Gmm, teneur en liant et Gsb pour vides, VMA, VFA.',f:'Gmb = A/(B − C) ; Vides = (Gmm − Gmb)/Gmm×100 ; VMA = 100 − Gmb×(100 − Pb)/Gsb ; VFA = (VMA − Vides)/VMA×100 ; quotient Marshall = stabilité/fluage.',a:'Vides négatifs : Gmm trop faible ou pesées erronées. Éprouvettes très dispersées : confection ou température d\'essai différentes.',l:'Le facteur de correction d\'épaisseur de la stabilité est à saisir selon la norme.'},
{t:'Extraction du liant',k:['liant','extraction','bitume','teneur en liant'],o:'Déterminer la teneur en liant d\'un enrobé.',d:'Masse initiale de l\'enrobé, masse des granulats après extraction, fines récupérées, eau éventuelle.',f:'Liant = M sèche − (granulats + fines récupérées) ; teneur % mélange = liant/M sèche×100 ; % granulats = liant/granulats×100.',a:'Liant négatif : masses incohérentes. Fines de la solution non récupérées : granulats sous-estimés, teneur en liant surestimée.'},
{t:'Densité in situ – méthode au sable',k:['sable','densite in situ','masse volumique en place','cone'],o:'Mesurer la masse volumique en place par le volume d\'un trou rempli de sable calibré.',d:'Étalonnage du sable (masse du pot, volume), masse de sable du cône, sable avant et après, masse de sol excavé, teneur en eau.',f:'ρsable = m pot/V pot ; V trou = (sable utilisé − sable du cône)/ρsable ; ρh = m sol/V trou ; ρd = ρh/(1 + w/100).',a:'Sable utilisé inférieur à celui du cône : saisie ou pesée erronée. ρ supérieure à 3 g/cm³ : volume du trou sous-estimé (pertes de sol ou de sable).'},
{t:'Densitomètre nucléaire',k:['nucleaire','gamma','gammadensimetre','densimetre'],o:'Obtenir rapidement masse volumique et teneur en eau en place.',d:'ρh et w lus sur l\'appareil, unité de masse volumique.',f:'ρd = ρh/(1 + w/100).',l:'Étalonnage, mode de mesure et profondeur relèvent de l\'appareil et de l\'opérateur ; l\'appli ne les contrôle pas.'},
{t:'Degré de compactage',k:['degre de compactage','compactage','dc'],o:'Comparer la densité obtenue en place à la référence Proctor.',d:'ρd en place, ρd max du Proctor de référence, seuil spécifié (optionnel).',f:'DC = ρd / ρd max × 100.',a:'DC supérieur à 105 % : vérifier la référence Proctor (matériau différent ?) et les mesures.',l:'Le seuil de conformité vient de votre marché ; l\'appli n\'en fixe pas.'},
{t:'Déflexion – poutre de Benkelman',k:['benkelman','deflexion','poutre'],o:'Mesurer la déflexion d\'une chaussée sous charge roulante.',d:'Lectures initiale et finale par point, rapport des bras de la poutre.',f:'d = |lecture initiale − lecture finale| × rapport des bras ; moyenne et écart-type sur la série.',l:'Corrections de température et de saison non appliquées.',a:'Déflexion très élevée : unité ou rapport des bras erroné, ou zone faible à localiser.'},
{t:'Températures des enrobés',k:['temperature','refroidissement','enrobe chaud','mise en oeuvre'],o:'Suivre le refroidissement de l\'enrobé entre la centrale et la fin du compactage.',d:'Températures et heures par étape, seuils de votre marché.',f:'ΔT = T étape − T précédente ; vitesse = ΔT/Δt en °C/min.',a:'Température qui augmente entre deux étapes : erreur de mesure ou de saisie.'},
{t:'Atelier de compactage',k:['atelier','compacteur','productivite','passes'],o:'Identifier l\'engin et estimer sa productivité.',d:'Largeur, vitesse, épaisseur de couche, passes, efficacité du chantier.',f:'Surface (m²/h) = largeur × vitesse × 1000 × efficacité / passes ; débit (m³/h) = surface × épaisseur.'},
{t:'Trafic et NEE',k:['nee','essieu','trafic','agressivite','cam'],o:'Convertir le trafic poids lourds en nombre d\'essieux équivalents de 13 t.',d:'Trafic journalier, agressivité (CAM ou Ag), croissance, durée.',f:'Onglet Routes : cumul = jours × TJ × ((1+i)^n − 1)/i ; NE = cumul × CAM. Document « Projet routier » : NE = 365·NPL·Ag·C1·C2·C3·((1+a)^n − 1)/a. Guide Grand Lyon : TC = TMJA×365×C ; NE = TC×CAM.',l:'Les coefficients dépendent du guide choisi ; vérifiez que vous utilisez les bonnes valeurs.'},
{t:'Dimensionnement indicatif',k:['dimensionnement','structure de chaussee','couche de forme','plateforme','pst','arase'],o:'Enchaîner trafic, portance, couche de forme et structure.',d:'Trafic, portance du sol (Ps ou CBR), type de voie.',f:'Classe de trafic → arase (Ps) → plateforme visée → couche de forme (tableau 6 du guide Grand Lyon) → structure lue dans le catalogue.',l:'Les épaisseurs des catalogues ne sont pas codées. Résultat indicatif, à valider par l\'ingénieur responsable.'},
{t:'Vérification au gel',k:['gel','gelif','indice de gel','qpf','dégel','degel'],o:'Vérifier la tenue de la chaussée au gel/dégel (guide Grand Lyon, §6).',d:'Zone gélive, gélivité du support, Epf, couche de forme non gélive, structure, QM et IA lus sur abaques.',f:'Qng = Ang·h²/(h + 0,1) ; Qpf = Qng + Qg + QM ; Eeq = Σ(E·h)/Σh des couches liées ; la structure convient si IA ≥ IR.',l:'QM et IA se lisent sur les abaques : l\'appli ne les calcule pas.'}];
function kbFind(q){const z=nrm(q);let b=null,bs=0;KB.forEach(e=>{const sc=e.k.reduce((a,k)=>a+(new RegExp('(^|[^a-z0-9])'+nrm(k).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(z)?k.length:0),0);if(sc>bs){bs=sc;b=e}});return b}
function kbHtml(e,q){const z=nrm(q),I={p:/proced|comment|etape|mode op|realis/.test(z),f:/formul|calcul|equation/.test(z),a:/anomal|erreur|incoh|ecart|probleme|bizarre|pourquoi|cause|investig|mauvais/.test(z),l:/limite|hypoth/.test(z)},any=I.p||I.f||I.a||I.l,sec=[['o','Objectif'],['d','Données nécessaires'],['f','Formules'],['p','Procédure'],['a','Anomalies et pistes d\'investigation'],['l','Limites et hypothèses']];

/* ---- Réglages ---- */
function set(){const p=P();return `<h2>Réglages</h2><div class="c"><h3>Projet actif</h3><label>Nom</label><input id="pn" value="${esc(p.nom)}"><label>Client</label><input id="pc" value="${esc(p.client)}"><label>Localisation du chantier</label><input id="pl" value="${esc(p.site)}"><label>Nom du laboratoire</label><input id="lb" value="${esc(S.labo)}">
<label>Référentiel</label><select id="rf">${[['none','Aucun'],['NF','NF / EN'],['ASTM','ASTM'],['AASHTO','AASHTO']].map(a=>`<option value="${a[0]}" ${S.ref==a[0]?'selected':''}>${a[1]}</option>`).join('')}</select>
<div class="r"><button onclick="ps()">Enregistrer</button><button class="s" onclick="pnw()">Nouveau projet</button><button class="d" onclick="pd()">Suppr. projet</button></div></div>
<div class="c"><button class="s" onclick="go('help')">Guide d'utilisation</button> <button class="s" onclick="go('tests')">Liste de contrôle des tests</button> <button class="s" onclick="go('about')">À propos</button></div><div class="c"><h3>Sauvegarde</h3><div class="r"><button onclick="dl('star-geotech-sauvegarde.json',JSON.stringify(S),'application/json')">Exporter</button><button class="s" onclick="$('#im').click()">Importer</button></div><input id="im" type="file" accept=".json" hidden onchange="imp(this.files[0])"></div>`}
function ps(){const p=P();p.nom=$('#pn').value||'Sans nom';p.client=$('#pc').value;p.site=$('#pl').value;S.labo=$('#lb').value;S.ref=$('#rf').value;save();toast('Enregistré');go('set')}
function pnw(){const id=Date.now();S.projects.push({id,nom:'Projet '+(S.projects.length+1),client:'',site:'',tests:[]});S.cur=id;save();go('set')}
function pd(){if(S.projects.length<2)return toast('Au moins un projet est requis');if(confirm('Supprimer ce projet et ses essais ?')){S.projects=S.projects.filter(p=>p.id!=S.cur);S.cur=S.projects[0].id;save();go('set')}}
function imp(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.projects)||!d.projects.length)throw 0;if(confirm('Remplacer les données actuelles ?')){S=d;S.theme=S.theme||'l';S.cur=S.projects[0].id;save();th();go('set')}}catch(e){toast('Fichier de sauvegarde invalide')}};r.readAsText(file)}
th();go('home');
</script></body></html>
